version: "3.9"

services:
  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - db-data:/app/instance
      - uploads:/app/uploads
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DATABASE_URL=sqlite:///instance/letter_tracker.db
    restart: unless-stopped

volumes:
  db-data:
  uploads:
